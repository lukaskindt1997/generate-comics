<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text review</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#222; --muted:#777; --line:#ddd8cc;
          --flag:#fff3d6; --flagb:#e7c66b; --ok:#e3f1e3; --okb:#86b886; --accent:#5a4632; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--accent); color:#fff; padding:10px 18px;
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; font-weight:600; }
  .tabs button { background:transparent; color:#fff; border:1px solid #fff6; border-radius:4px;
                 padding:4px 10px; margin-right:4px; cursor:pointer; font:inherit; }
  .tabs button.active { background:#fff; color:var(--accent); }
  .tabs button .n { font-size:11px; opacity:.8; margin-left:4px; }
  #status { margin-left:auto; font-size:13px; opacity:.9; }
  main { max-width:1500px; margin:0 auto; padding:18px; }
  .pagebar { display:flex; gap:18px; align-items:center; margin-bottom:14px; color:var(--muted); }
  .pagebar a { color:var(--accent); }
  .para { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:16px;
          background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .para.done { border-color:var(--okb); background:#fbfffb; }
  .para img { width:100%; border-radius:4px; display:block; background:#eee; min-height:40px; }
  textarea { width:100%; min-height:110px; font:16px/1.5 Georgia, serif; padding:8px; border:1px solid var(--line);
             border-radius:4px; resize:vertical; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; align-items:center; }
  .tools button, .flag button { font:inherit; font-size:13px; padding:3px 8px; border:1px solid #bbb;
             border-radius:4px; background:#fafafa; cursor:pointer; }
  .tools label { margin-left:auto; font-size:14px; cursor:pointer; }
  .flag { background:var(--flag); border:1px solid var(--flagb); border-radius:4px; padding:6px 8px;
          margin-top:6px; font-size:14px; }
  .flag.closed { background:#f1f1f1; border-color:#ddd; color:var(--muted); }
  .flag .t { font-size:12px; color:#3d7a3d; font-weight:600; }
  .flag .ctx { font-family:Georgia, serif; color:#555; display:block; margin-top:2px; }
  .flag .ctx b { background:#ffe08a; }
  .flag .act { float:right; display:flex; gap:4px; }
  .hint { color:var(--muted); font-size:13px; }
  .modes button { font:inherit; font-size:13px; padding:3px 10px; border:1px solid #bbb; background:#fafafa;
                  cursor:pointer; margin-right:-1px; }
  .modes button:first-child { border-radius:4px 0 0 4px; } .modes button:last-child { border-radius:0 4px 4px 0; }
  .modes button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .question { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .question .q { font-weight:600; margin-bottom:4px; }
  .question .hint { margin-bottom:6px; }
  .planwrap { display:grid; grid-template-columns: 340px minmax(0,1fr); gap:18px; align-items:start; }
  .sketch { position:sticky; top:64px; width:340px; aspect-ratio: 1 / 1.35; background:#fff; border:1px solid #999;
            padding:6px; display:flex; flex-direction:column; gap:6px; }
  .tier { display:flex; gap:6px; }
  .pbox { border:2px solid #333; background:#faf8f3; padding:4px 6px; overflow:hidden; color:inherit;
          text-decoration:none; display:flex; flex-direction:column; font-size:11px; line-height:1.25; }
  .pbox:hover { background:#fff3d6; }
  .pbox .pn { font-size:18px; font-weight:700; } .pbox .ps { font-weight:600; color:var(--accent); }
  .pbox .pp { color:#555; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .panel h3 { margin:0 0 4px; font-size:16px; } .panel p { margin:8px 0; }
  .panel > div { margin-top:4px; } .sub { margin-left:12px; } .cap { font-family:Georgia, serif; }
  .safety { background:#fdecea; border:1px solid #e6a7a0; border-radius:4px; padding:4px 8px; font-size:13px; margin-top:6px; }
  .cands { display:grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap:12px; margin-top:10px; }
  .cand { border:2px solid var(--line); border-radius:6px; padding:6px; background:#fafafa; }
  .cand.approved { border-color:var(--okb); background:#f3fbf3; }
  .cand img, .approvedbox img { width:100%; display:block; border-radius:4px; }
  .approvedbox { max-width:820px; margin:8px 0; }
  .review { font-size:13px; margin-top:6px; line-height:1.35; }
  .review .dev { color:#9a3412; } .review .dev.book { color:#b91c1c; font-weight:600; } .review .dev.free { color:#8a6d1c; } .review .story { color:#6b4f12; }
  .review .pro { color:#2f6b2f; } .review .con { color:#8a2b2b; }
  .badge.warn { background:#fdecea; color:#9a3412; }
  .cand.best { box-shadow: 0 0 0 3px #e7c66b; }
  .verdict { background:#fffbea; border:1px solid var(--flagb); border-radius:6px; padding:8px 10px; margin:10px 0; font-size:14px; }
  .verdict .issues, .verdict .suggest { margin-top:8px; }
  .verdict .habit { background:#eef4fb; border:1px solid #b9cfe6; border-radius:6px; padding:6px 8px; }
  .verdict .habit .sub { margin:6px 0 0 0; }
  .verdict .habit .quote { margin:2px 0 2px 0; font-style:italic; }
  .reflayout { display:grid; grid-template-columns: 230px minmax(0,1fr); gap:18px; align-items:start; }
  .sidebar { position:sticky; top:64px; background:var(--card); border:1px solid var(--line); border-radius:8px;
             padding:10px; max-height:calc(100vh - 84px); overflow:auto; }
  .sidebar input { width:100%; font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:4px; margin-bottom:8px; }
  .stitle { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:8px 0 4px; }
  .sitem { display:block; padding:4px 6px; border-radius:4px; color:inherit; text-decoration:none; font-size:14px; }
  .sitem:hover { background:#f3efe6; } .sitem.on { background:var(--accent); color:#fff; }
  .sicon { display:inline-block; width:20px; }
  .legend { margin-top:12px; font-size:11px; }
  #jobs { position:fixed; right:16px; bottom:16px; z-index:20; width:290px; background:#fff; border:1px solid var(--accent);
          border-radius:8px; box-shadow:0 4px 18px #0002; padding:8px 10px; font-size:13px; }
  #jobs .jtitle { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:4px; }
  #jobs .jitem { display:block; color:inherit; text-decoration:none; padding:5px 6px; border-radius:4px; }
  #jobs .jitem:hover { background:#f3efe6; } #jobs .jitem.now { background:#fff3d6; }
  #jobs .jwhat { color:#555; }
  #jobs .jbar { height:5px; background:#eee; border-radius:3px; margin-top:4px; overflow:hidden; }
  #jobs .jbar div { height:100%; background:var(--accent); }
  .preview .pbox { background-size:cover; background-position:center; color:#fff; text-shadow:0 0 3px #000; }
  .preview .pbox.chosen { border-color:var(--okb); }
  .textwrap { position:relative; container-type:inline-size; } .textwrap img { display:block; }
  .preview .pbox { container-type:inline-size; }
  .textbox { position:absolute; background:rgba(255,253,240,.9); border-style:solid; border-color:#222;
             font-family:Georgia, serif; color:#111; pointer-events:none; text-shadow:none; overflow-wrap:break-word; }
  .textbox.speech { border-radius:1.2em; }
  .bookwrap { position:relative; background:#3a3530; padding:16px 72px; border-radius:8px; }
  .bookwrap:fullscreen { padding:24px 72px; border-radius:0; background:#1e1b18; overflow-y:auto; }
  .bookpage { position:relative; aspect-ratio: 2480 / 3350; background:#fff; box-shadow:0 4px 24px #0006; margin:0 auto; }
  .bookpage.fit-width { width:100%; }
  .bookpage.fit-height { height:calc(100vh - 190px); }
  .bookwrap:fullscreen .bookpage.fit-height { height:calc(100vh - 48px); }
  .bookpanel { position:absolute; background-size:cover; background-position:center; border:2px solid #000;
               container-type:inline-size; overflow:hidden; }
  .bookpanel.empty { background:#e0e0e0; display:flex; align-items:center; justify-content:center; }
  .emptylabel { color:#777; font-size:13px; }
  .pstatus { position:absolute; right:4px; bottom:4px; font-size:11px; padding:1px 6px; border-radius:8px;
             background:#fff; color:#333; }
  .pstatus.chosen { background:#e3f1e3; } .pstatus.not-generated { background:#fdecea; }
  .booknav { position:fixed; top:50%; transform:translateY(-50%); font-size:42px; line-height:1; width:52px; height:84px;
             border:none; border-radius:6px; background:#0006; color:#fff; cursor:pointer; z-index:30; }
  .booknav:hover { background:#000a; }
  .booknav:disabled { opacity:.15; cursor:default; } .booknav.prev { left:10px; } .booknav.next { right:10px; }
  .bookno { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px;
            background:#0008; padding:3px 12px; border-radius:10px; z-index:30; }
  .btnlink { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--accent); border-radius:4px;
             color:var(--accent); text-decoration:none; background:#fff; }
  pre.prompt { white-space:pre-wrap; font-size:12px; background:#f6f4ef; padding:8px; border-radius:4px; }
  .openpoints { background:#f6f4ef; border-radius:6px; padding:6px 10px; margin:6px 0; font-size:14px; }
  .openpoints summary { cursor:pointer; }
  .blocked { background:#fdecea; border:2px solid #d9534f; border-radius:6px; padding:8px 10px; margin:8px 0; font-size:14px; }
  .blocked a { font-weight:600; }
  .refshow { display:flex; gap:0; margin-bottom:8px; }
  .refshow button { flex:1; font:inherit; font-size:12px; padding:3px 4px; border:1px solid #bbb; background:#fafafa;
                    cursor:pointer; margin-right:-1px; }
  .refshow button:first-child { border-radius:4px 0 0 4px; } .refshow button:last-child { border-radius:0 4px 4px 0; }
  .refshow button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rchips .rchip { display:inline-block; margin:2px 8px 2px 0; }
  .newref { margin-bottom:8px; } .newref summary { cursor:pointer; font-weight:600; font-size:14px; }
  .newref select, .newref input { width:100%; margin:4px 0; font:inherit; }
  .sitem.sugg { color:#555; } .sitem.sugg.planned { color:var(--ink); font-weight:600; }
  button.mini { font-size:11px; padding:0 6px; float:right; }
  .badge { font-size:12px; padding:2px 8px; border-radius:10px; }
  .badge.rec { background:#e3eefa; color:#2b5b8a; } .badge.user { background:#e3f1e3; color:#2f6b2f; }
  .badge.none { background:#eee; color:#777; }
  textarea.answer { min-height:60px; font:15px/1.4 -apple-system, system-ui, sans-serif; }
  .captions { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px;
              margin-top:14px; font-family:Georgia, serif; }
  .captions b { font-family:-apple-system, system-ui, sans-serif; display:block; margin-bottom:4px; }
  .finish { display:flex; gap:16px; align-items:center; justify-content:flex-end; padding:16px 4px 40px; font-size:15px; }
  .finish button { font:inherit; padding:8px 16px; border-radius:6px; border:1px solid #bbb; background:#fafafa; cursor:pointer; }
  .finish button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .help { background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px 12px;
          margin-bottom:14px; font-size:14px; color:#444; }
  .flag button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .flag .act { margin-left:8px; }
  .num { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Text review</h1>
  <div class="tabs" id="tabs"></div>
  <div class="tabs"><button id="refsBtn" onclick="mode='refs'; refsSig=''; render(); window.scrollTo(0,0)">References</button><button id="bookBtn" onclick="mode='book'; render(); window.scrollTo(0,0)">Pages</button></div>
  <div id="status">loading…</div>
</header>
<main id="main"></main>
<aside id="jobs" hidden></aside>

<script>
let state = null, current = 0, saveTimer = null, mode = "text";
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};

async function load() {
  state = await (await fetch("/api/state")).json();
  // Start at the page in the URL (#p4), else at the first unfinished page.
  const fromHash = state.pages.findIndex(pg => "#p" + pg.page === location.hash);
  const firstOpen = state.pages.findIndex(pg => !pg.finished);
  current = fromHash >= 0 ? fromHash : (firstOpen >= 0 ? firstOpen : 0);
  render();
  setStatus("loaded");
}

function setStatus(s) { document.getElementById("status").textContent = s + " · " + progress(); }

function openFlags(pg) {
  return pg.paragraphs.reduce((n, p) => n + p.flags.filter(f => f.status === "open").length, 0);
}

function progress() {
  const finished = state.pages.filter(pg => pg.finished).length;
  return `${finished}/${state.pages.length} pages finished`;
}

function scheduleSave() {
  setStatus("unsaved…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}

async function save() {
  const r = await fetch("/api/state", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify(state) });
  setStatus(r.ok ? "saved " + new Date().toLocaleTimeString() : "SAVE FAILED: " + await r.text());
  renderTabs();
}

function cropUrl(stem, b) {
  return b ? `/crop?stem=${stem}&x=${b.x.toFixed(4)}&y=${b.y.toFixed(4)}&w=${b.w.toFixed(4)}&h=${b.h.toFixed(4)}` : "";
}

function union(a, b) {
  if (!a) return b; if (!b) return a;
  const x0 = Math.min(a.x, b.x), y0 = Math.min(a.y, b.y);
  const x1 = Math.max(a.x + a.w, b.x + b.w), y1 = Math.max(a.y + a.h, b.y + b.h);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function renderTabs() {
  document.getElementById("refsBtn").className = mode === "refs" ? "active" : "";
  document.getElementById("bookBtn").className = mode === "book" ? "active" : "";
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...state.pages.map((pg, i) => {
    return $("button", { class: i === current && mode !== "refs" && mode !== "book" ? "active" : "", onclick: () => goTo(i) },
             `p${pg.page}`, $("span", { class: "n" }, pg.finished ? "✓" : `${openFlags(pg)}⚑`));
  }));
}

const EXPLAIN = {
  name: "This looks like a misread name.",
  suspect: "A real word, but one that OCR often gets wrong.",
  unknown: "Not a known word, so probably misread.",
  quotes: "The quote marks don't add up here, so one may be missing.",
  first_letter: "The large first letter of the chapter was probably lost.",
  disagree: "The two OCR readings disagree here.",
};
const CLOSED = {
  applied: "✓ suggestion used", fixed: "✓ fixed by hand", correct: "✓ text was correct",
  resolved: "✓ closed",
};

function highlight(ctx, word) {
  const span = $("span", { class: "ctx" });
  if (!ctx) return span;
  const i = word ? ctx.indexOf(word) : -1;
  if (i < 0) { span.append("…" + ctx + "…"); return span; }
  span.append("…" + ctx.slice(0, i), $("b", {}, word), ctx.slice(i + word.length) + "…");
  return span;
}

function goTo(i) {
  current = i;
  if (mode === "refs" || mode === "book") mode = "text";
  history.replaceState(null, "", "#p" + state.pages[i].page);
  render();
  window.scrollTo(0, 0);
}

async function finishPage() {
  const pg = state.pages[current];
  const open = openFlags(pg);
  if (open && !confirm(`${open} yellow box(es) on this page are still unanswered. Finish anyway?`)) return;
  pg.finished = true;
  clearTimeout(saveTimer);
  await save();
  const next = state.pages.findIndex((p, i) => i > current && !p.finished);
  if (next >= 0) goTo(next); else render();
}

function modeSwitch() {
  return $("span", { class: "modes" },
    $("button", { class: mode === "text" ? "on" : "", onclick: () => { mode = "text"; render(); } }, "1 · Text"),
    $("button", { class: mode === "questions" ? "on" : "", onclick: () => { mode = "questions"; render(); } }, "2 · Questions"),
    $("button", { class: mode === "plan" ? "on" : "", onclick: () => { mode = "plan"; render(); } }, "3 · Plan"),
    $("button", { class: mode === "panels" ? "on" : "", onclick: () => { mode = "panels"; panelsSig = ""; render(); } }, "4 · Panels"));
}

function render() {
  renderTabs();
  const pg = state.pages[current];
  const main = document.getElementById("main");
  if (mode === "refs") return renderRefs(main);
  if (mode === "book") return renderBook(main);
  if (mode === "questions") return renderQuestions(pg, main);
  if (mode === "plan") return renderPlan(pg, main);
  if (mode === "panels") return renderPanels(pg, main);
  const bar = $("div", { class: "pagebar" },
    $("strong", {}, `Page ${pg.page} — ${pg.photo}`), modeSwitch(),
    $("a", { href: `/page?stem=${pg.stem}`, target: "_blank" }, "open full photo"),
    $("label", {}, $("input", { type: "checkbox", checked: pg.continues_previous,
        onchange: e => { pg.continues_previous = e.target.checked; scheduleSave(); } }),
      " first paragraph continues the previous page"),
  );
  const help = $("div", { class: "help" },
    "Compare each text with the photo next to it and fix it directly in the text box. ",
    "Yellow boxes are possible errors. For each one, pick ",
    $("b", {}, "Use suggestion"), ", ", $("b", {}, "Fixed it myself"), " or ",
    $("b", {}, "Text is correct"), " (false alarm). A blank line inside a text box splits a paragraph; ",
    $("b", {}, "insert [[?]]"), " marks text you can't read. When the page matches the photo, click ",
    $("b", {}, "Finish page"), " at the bottom.");
  const open = openFlags(pg);
  const finish = $("div", { class: "finish" },
    pg.finished
      ? [$("span", {}, `✓ Page ${pg.page} is finished. Edits are still saved.`),
         $("button", { onclick: () => { pg.finished = false; scheduleSave(); render(); } }, "Reopen page")]
      : [$("span", {}, open ? `${open} yellow box(es) still unanswered on this page.` : "All yellow boxes answered."),
         $("button", { class: "primary", onclick: finishPage }, `Finish page ${pg.page} →`)],
    pg.finished ? $("button", { class: "primary", onclick: () => { mode = "questions"; render(); window.scrollTo(0, 0); } },
                    "Go to questions →") : null);
  main.replaceChildren(bar, help, ...pg.paragraphs.map((p, i) => renderPara(pg, p, i)), finish);
  setStatus("page " + pg.page);
}

function renderPara(pg, p, i) {
  const ta = $("textarea", { oninput: e => { p.text = e.target.value; scheduleSave(); } });
  ta.value = p.text;
  const flags = p.flags.map(f => {
    const closed = f.status !== "open";
    const canApply = f.word && f.suggestion && ["name", "suspect", "unknown"].includes(f.type);
    const close = status => () => { f.status = status; scheduleSave(); render(); };
    const act = $("span", { class: "act" },
      closed ? $("button", { onclick: close("open") }, "undo") : [
        canApply ? $("button", { class: "primary", onclick: () => {
          const idx = p.text.indexOf(f.word);
          if (idx < 0) { alert(`"${f.word}" is no longer in the text. If you already fixed it, choose "Fixed it myself".`); return; }
          p.text = p.text.slice(0, idx) + f.suggestion + p.text.slice(idx + f.word.length);
          f.status = "applied"; scheduleSave(); render();
        } }, "Use suggestion") : null,
        $("button", { onclick: close("fixed"), title: "It was an error and you corrected the text yourself" }, "Fixed it myself"),
        $("button", { onclick: close("correct"), title: "False alarm: the text matches the photo" }, "Text is correct"),
      ]);
    return $("div", { class: "flag" + (closed ? " closed" : "") }, act,
      closed ? $("span", { class: "t" }, CLOSED[f.status] || "✓ closed") : null,
      $("div", {}, EXPLAIN[f.type] || f.type),
      f.word ? $("strong", {}, f.word) : null,
      f.suggestion ? (canApply ? ` → ${f.suggestion}` : $("span", { class: "hint" }, ` (${f.suggestion})`)) : "",
      f.other_reading ? $("span", { class: "hint" }, `  · other reading: ${f.other_reading}`) : null,
      highlight(f.context, f.word));
  });
  const tools = $("div", { class: "tools" },
    $("span", { class: "num" }, `¶${i + 1}`),
    i > 0 ? $("button", { title: "Join this paragraph to the one above", onclick: () => {
      const prev = pg.paragraphs[i - 1];
      prev.text = prev.text.trimEnd() + " " + p.text.trimStart();
      prev.box = union(prev.box, p.box);
      prev.flags = prev.flags.concat(p.flags);
      prev.done = false;
      pg.paragraphs.splice(i, 1);
      scheduleSave(); render();
    } }, "↑ merge with previous") : null,
    $("button", { title: "Insert [[?]] at the cursor for text you cannot read", onclick: () => {
      const pos = ta.selectionStart ?? p.text.length;
      p.text = p.text.slice(0, pos) + "[[?]]" + p.text.slice(pos);
      scheduleSave(); render();
    } }, "insert [[?]]"));
  return $("div", { class: "para" },
    $("div", {}, p.box ? $("img", { src: cropUrl(pg.stem, p.box), loading: "lazy" })
                       : $("div", { class: "hint" }, "(no photo region)")),
    $("div", {}, ta, tools, flags));
}

async function renderQuestions(pg, main) {
  const bar = $("div", { class: "pagebar" }, $("strong", {}, `Page ${pg.page}`), modeSwitch());
  main.replaceChildren(bar, $("p", { class: "hint" }, "loading…"));
  const info = await (await fetch(`/api/scene?page=${pg.page}`)).json();
  const analyse = $("button", { class: "primary", onclick: async () => {
    analyse.disabled = true; analyse.textContent = "Analysing… (about a minute)";
    const r = await (await fetch("/api/analyse", { method: "POST", body: JSON.stringify({ page: pg.page }) })).json();
    if (!r.ok) alert("Analysis failed:\n" + r.log);
    render();
  } }, info.exists ? "Re-run analysis" : "Analyse this page");
  if (!pg.finished) {
    main.replaceChildren(bar, $("div", { class: "help" },
      "Finish the text review of this page first (tab 1 · Text); the analysis uses the reviewed text."));
    return;
  }
  if (!info.exists) {
    main.replaceChildren(bar, $("div", { class: "help" },
      "Claude reads this page (with the chapter brief) and lists characters, story beats, captions ",
      "and the questions the book leaves open."), $("div", { class: "finish" }, analyse));
    return;
  }
  let timer = null;
  const saveAnswers = () => {
    clearTimeout(timer);
    setStatus("unsaved…");
    timer = setTimeout(async () => {
      const r = await fetch("/api/answers", { method: "POST",
        body: JSON.stringify({ page: pg.page, answers: info.questions }) });
      setStatus(r.ok ? "answers saved " + new Date().toLocaleTimeString() : "SAVE FAILED");
    }, 600);
  };
  const qs = info.questions.map((q, i) => {
    const badge = $("span", { class: "badge" });
    const updateBadge = () => {
      const rec = q.recommendation && q.answer.trim() === q.recommendation.trim();
      badge.textContent = !q.answer.trim() ? "empty: planner decides" : rec ? "recommendation (accepted)" : "your answer";
      badge.className = "badge " + (!q.answer.trim() ? "none" : rec ? "rec" : "user");
    };
    const ta = $("textarea", { class: "answer", placeholder: "Empty = let the planner decide.",
                               oninput: e => { q.answer = e.target.value; updateBadge(); saveAnswers(); } });
    ta.value = q.answer;
    updateBadge();
    const scope = $("select", { onchange: e => { q.scope = e.target.value; saveAnswers(); } },
      $("option", { value: "story", selected: q.scope === "story" }, "applies to the whole story"),
      $("option", { value: "page", selected: q.scope === "page" }, "this page only"));
    const reset = q.recommendation ? $("button", { onclick: () => {
      q.answer = q.recommendation; q.scope = q.default_scope; ta.value = q.answer;
      scope.value = q.scope; updateBadge(); saveAnswers();
    } }, "back to recommendation") : null;
    return $("div", { class: "question" }, $("div", { class: "q" }, `${i + 1}. ${q.question}`),
             q.reason ? $("div", { class: "hint" }, "Why I recommend this: " + q.reason) : null,
             ta, $("div", { class: "tools" }, badge, scope, reset));
  });
  main.replaceChildren(bar,
    $("div", { class: "help" },
      $("b", {}, "What happens on this page: "), info.summary,
      $("div", { class: "hint", style: "margin-top:6px" },
        "These are questions the book leaves open. Each one is pre-filled with my recommendation: leave it ",
        "to accept, or change it. Answers marked “whole story” (e.g. what a character looks like) also apply ",
        "to later pages. Saved automatically.")),
    ...qs,
    $("div", { class: "captions" }, $("b", {}, "Proposed captions"),
      ...info.captions.map(c => $("div", {}, "• " + c.text))),
    $("div", { class: "finish" }, analyse, acceptBtn(pg)));
}

function acceptBtn(pg) {
  const btn = $("button", { class: "primary", onclick: async () => {
    const plan = await (await fetch(`/api/plan?page=${pg.page}`)).json();
    if (plan.exists && !confirm("A page plan already exists. Make a new one with the current answers?\n(Cancel = just show the existing plan.)")) {
      mode = "plan"; render(); return;
    }
    pg.questions_accepted = true; clearTimeout(saveTimer); await save();
    btn.disabled = true; btn.textContent = "Creating page plan… (about a minute)";
    const r = await (await fetch("/api/plan", { method: "POST", body: JSON.stringify({ page: pg.page }) })).json();
    if (!r.ok) { alert("Planning failed:\n" + r.log); render(); return; }
    mode = "plan"; render(); window.scrollTo(0, 0);
  } }, "Accept answers & create page plan →");
  return btn;
}

const SHOT = { extreme_wide: "extreme wide", wide: "wide", medium_wide: "medium wide", medium: "medium",
               medium_close: "medium close", close_up: "close-up", extreme_close_up: "extreme close-up" };
const ANGLE = { eye_level: "eye level", low: "low angle", high: "high angle", birds_eye: "bird's-eye",
                worms_eye: "worm's-eye", over_the_shoulder: "over the shoulder", dutch: "tilted" };

async function renderPlan(pg, main) {
  const bar = $("div", { class: "pagebar" }, $("strong", {}, `Page ${pg.page}`), modeSwitch());
  main.replaceChildren(bar, $("p", { class: "hint" }, "loading…"));
  const info = await (await fetch(`/api/plan?page=${pg.page}`)).json();
  if (!info.exists) {
    main.replaceChildren(bar, $("div", { class: "help" },
      "No page plan yet. Go to ", $("b", {}, "2 · Questions"), " and click ", $("b", {}, "Accept answers & create page plan"), "."));
    return;
  }
  const plan = info.plan;
  const byNum = Object.fromEntries(plan.panels.map(p => [p.panel, p]));
  const sketch = $("div", { class: "sketch" }, ...plan.tiers.map(t =>
    $("div", { class: "tier", style: `height:${(t.height * 100).toFixed(1)}%` }, ...t.panels.map(tp => {
      const p = byNum[tp.panel] || {};
      return $("a", { class: "pbox", href: `#panel-${tp.panel}`, style: `width:${(tp.width * 100).toFixed(1)}%`,
                      onclick: e => { e.preventDefault(); document.getElementById(`panel-${tp.panel}`).scrollIntoView({ behavior: "smooth" }); } },
        $("span", { class: "pn" }, tp.panel), $("span", { class: "ps" }, `${SHOT[p.shot] || ""}`),
        $("span", { class: "pp" }, p.purpose || ""));
    }))));
  const details = plan.panels.map(p => $("div", { class: "panel", id: `panel-${p.panel}` },
    $("h3", {}, `Panel ${p.panel} · ${SHOT[p.shot]} · ${ANGLE[p.angle]}`),
    $("div", { class: "hint" }, p.purpose),
    $("p", {}, p.description),
    p.characters.length ? $("div", {}, $("b", {}, "Characters: "),
      ...p.characters.map(c => $("div", { class: "sub" }, `${c.id}: ${c.position}; ${c.pose}; ${c.expression}; facing ${c.facing}`))) : null,
    $("div", {}, $("b", {}, "Light: "), p.lighting),
    p.captions.length ? $("div", {}, $("b", {}, "Captions: "),
      ...p.captions.map(c => $("div", { class: "sub cap" }, `[${c.placement.replace("_", " ")}] ${c.text}`))) : null,
    p.dialogue.length ? $("div", {}, $("b", {}, "Dialogue: "),
      ...p.dialogue.map(d => $("div", { class: "sub cap" }, `${d.speaker} [${d.placement.replace("_", " ")}]: ${d.text}`))) : null,
    $("div", {}, $("b", {}, "Keep free for text: "), p.text_space),
    // New plans: show a note only for flagged panels. Older plans (no flags field): show as before.
    (p.content_flags ? p.content_flags.length : p.safety_notes)
      ? $("div", { class: "safety" }, (p.content_flags && p.content_flags.length ? `Content: ${p.content_flags.join(", ")}. ` : ""),
          p.safety_notes || "") : null));
  const note = $("textarea", { class: "answer", placeholder: "Want changes? Describe them, e.g. “make panel 2 bigger” or “show the Vane from behind in panel 3”." });
  const replan = $("button", { onclick: async () => {
    if (!note.value.trim()) { alert("Describe what should change first."); return; }
    replan.disabled = true; replan.textContent = "Re-planning… (about a minute)";
    const r = await (await fetch("/api/plan", { method: "POST", body: JSON.stringify({ page: pg.page, note: note.value }) })).json();
    if (!r.ok) alert("Planning failed:\n" + r.log);
    pg.plan_accepted = false; scheduleSave(); render(); window.scrollTo(0, 0);
  } }, "Re-plan with this feedback");
  const accept = pg.plan_accepted
    ? $("span", {}, "✓ Plan accepted. ", $("button", { class: "primary", onclick: () => { mode = "panels"; panelsSig = ""; render(); window.scrollTo(0, 0); } }, "Go to panels →"), " ",
        $("button", { onclick: () => { pg.plan_accepted = false; scheduleSave(); render(); } }, "undo"))
    : $("button", { class: "primary", onclick: () => { pg.plan_accepted = true; scheduleSave(); mode = "panels"; panelsSig = ""; render(); window.scrollTo(0, 0); } }, "Accept plan & go to panels →");
  main.replaceChildren(bar,
    $("div", { class: "help" }, $("b", {}, "Idea: "), plan.page_concept),
    info.problems.length ? $("div", { class: "safety" }, "Layout warnings: " + info.problems.join("; ")) : null,
    $("div", { class: "planwrap" }, sketch, $("div", { class: "details" }, ...details)),
    $("div", { class: "panel" }, $("b", {}, "Choices the planner made"),
      ...plan.design_choices.map(c => $("div", { class: "sub" }, "• " + c))),
    $("div", { class: "panel" }, $("b", {}, "Change the plan"), note, $("div", { class: "tools" }, replan)),
    $("div", { class: "finish" }, accept));
}

let refsPoll = null, refsSig = "", refFilter = "", refShow = localStorage.getItem("refShow") || "all";
let refSel = (location.hash.match(/^#ref=(.+)$/) || [])[1] || null;
if (refSel) { refSel = decodeURIComponent(refSel); mode = "refs"; }

const KIND_TITLES = { characters: "Characters", objects: "Objects", locations: "Locations" };

function refState(r) {
  if (r.running) return { icon: "⏳", title: "working" };
  if (r.queued.length) return { icon: "🕒", title: `queued (position ${r.queued[0].position})` };
  if (r.ref.kind === "location") return { icon: "📝", title: "location: description only (used as text in panel prompts)" };
  const waiting = (r.components || []).filter(c => !c.approved);
  if (waiting.length) return { icon: "⛔", title: "waiting for: " + waiting.map(c => c.name).join(", ") };
  if (!r.candidates.length) return { icon: "○", title: "no images yet: generate candidates" };
  if (!r.ref.approved) return { icon: "⚠", title: "no approved reference" };
  const a = r.assessment;
  if (a && a.best && !a.best.endsWith(r.ref.approved.from_candidate)) return { icon: "★", title: "assessment prefers another candidate" };
  return { icon: "✓", title: "approved" };
}

function refSidebar(refs, main) {
  const search = $("input", { type: "search", placeholder: "Search…", value: refFilter, oninput: e => {
    refFilter = e.target.value; refsSig = ""; renderRefs(main);
  } });
  const needsApproval = r => r.ref.kind !== "location" && !r.ref.approved;
  const counts = { all: refs.length, todo: refs.filter(needsApproval).length,
                   done: refs.filter(r => !needsApproval(r)).length };
  const showBtn = (key, label) => $("button", { class: refShow === key ? "on" : "",
    onclick: () => { refShow = key; localStorage.setItem("refShow", key); refsSig = ""; renderRefs(main); } },
    `${label} (${counts[key]})`);
  const show = $("div", { class: "refshow" }, showBtn("all", "All"), showBtn("todo", "Not approved"), showBtn("done", "Approved"));
  const groups = {};
  for (const r of refs) {
    if (refShow === "todo" && !needsApproval(r)) continue;
    if (refShow === "done" && needsApproval(r)) continue;
    if (refFilter && !r.ref.name.toLowerCase().includes(refFilter.toLowerCase())) continue;
    (groups[r.path.split("/")[0]] ||= []).push(r);
  }
  const sections = Object.keys(KIND_TITLES).filter(k => groups[k]).map(k =>
    $("div", { class: "sgroup" }, $("div", { class: "stitle" }, `${KIND_TITLES[k]} (${groups[k].length})`),
      ...groups[k].sort((a, b) => a.ref.name.localeCompare(b.ref.name)).map(r => {
        const st = refState(r);
        return $("a", { class: "sitem" + (r.path === refSel ? " on" : ""), href: `#ref=${encodeURIComponent(r.path)}`, title: st.title,
                        onclick: e => { e.preventDefault(); refSel = r.path; history.replaceState(null, "", `#ref=${encodeURIComponent(r.path)}`);
                                        refsSig = ""; renderRefs(main); window.scrollTo(0, 0); } },
          $("span", { class: "sicon" }, st.icon), r.ref.name);
      })));
  const empty = sections.length ? null : $("div", { class: "hint", style: "margin:8px 0" },
    refShow === "todo" ? "Everything is approved. ✓" : "Nothing matches.");
  return $("nav", { class: "sidebar" }, search, show, ...sections, empty,
    $("div", { class: "hint legend" }, "References are created automatically for everything a planned panel shows. ",
      "✓ approved · ⚠ none approved · 📝 location (description only) · ○ no images yet · ⛔ waiting for another reference · ★ better candidate suggested · ⏳ working · 🕒 queued"));
}

async function renderRefs(main, fromPoll = false) {
  clearTimeout(refsPoll);
  if (mode !== "refs") return;
  const refs = await (await fetch("/api/refs")).json();
  const sig = JSON.stringify(refs.map(r => [r.candidates.length, r.running, r.status, r.queued,
                                            r.ref.approved && r.ref.approved.version, r.assessment && r.assessment.created_utc]));
  const editing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
  if (fromPoll && (sig === refsSig || editing)) {
    refsPoll = setTimeout(() => renderRefs(main, true), 5000);
    return;
  }
  refsSig = sig;
  if (!refs.some(r => r.path === refSel)) {
    refSel = (refs.find(r => !r.ref.approved) || refs[0] || {}).path || null;
  }
  const selected = refs.filter(r => r.path === refSel);
  const cards = selected.map(r => {
    const desc = $("textarea", { class: "answer", onchange: async e => {
      await fetch("/api/ref/update", { method: "POST", body: JSON.stringify({ path: r.path, description: e.target.value }) });
      setStatus("description saved");
    } });
    desc.value = r.ref.description;
    const post = async (url, body) => {
      const res = await (await fetch(url, { method: "POST", body: JSON.stringify(body) })).json();
      if (!res.ok) alert(res.message);
      renderRefs(main);
    };
    const waitingFor = (r.components || []).filter(c => !c.approved);
    const busyHere = r.running || r.queued.length > 0 || waitingFor.length > 0;  // blocked = no generating
    const refLink = c => $("a", { href: `#ref=${encodeURIComponent(c.path)}`, onclick: e => { e.preventDefault(); goToRef(c.path); } }, c.name);
    const blockedBanner = waitingFor.length ? $("div", { class: "blocked" },
      $("b", {}, "⛔ Can't generate yet."), " This character wears or carries ",
      ...waitingFor.flatMap((c, i) => [i ? (i === waitingFor.length - 1 ? " and " : ", ") : "", refLink(c),
        $("span", { class: "hint" }, c.has_images ? " (choose and approve a candidate)" : " (no images yet: generate candidates first)")]),
      ". Approve ", waitingFor.length > 1 ? "those" : "that", " first: the approved image", waitingFor.length > 1 ? "s are" : " is",
      " used as reference so it looks the same everywhere.") : null;
    const verb = r.busy ? "Queue: " : "";
    const gen = $("button", { disabled: busyHere,
                              title: waitingFor.length ? "Approve the worn/carried objects first" : "",
                              onclick: () => post("/api/ref/generate", { path: r.path, count: 4 }) },
      verb + (r.candidates.length ? "Generate 4 more (current description)" : "Generate 4 candidates"));
    const assessBtn = $("button", { disabled: busyHere || !r.candidates.length,
      onclick: () => post("/api/ref/assess", { path: r.path }) }, r.assessment ? "Re-assess" : "Assess candidates");
    const a = r.assessment;
    const stale = a && a.description_assessed !== r.ref.description;
    const verdict = a ? $("div", { class: "verdict" },
      $("b", {}, "Assessment"), stale ? $("span", { class: "hint" }, " (made with an older description)") : null,
      $("div", {}, a.best ? ["Best candidate: ", $("b", {}, "seed " + (a.best.match(/seed(\d+)/) || [, a.best])[1]), ". "] : "No usable candidate. ",
        a.best_reason),
      a.persistent_issues && a.persistent_issues.length
        ? $("div", { class: "issues habit" }, $("b", {}, "FLUX keeps doing this:"),
            $("div", { class: "hint" }, stale ? "The description changed: wait for the re-assessment before accepting the next one."
              : "It appears in many candidates and fixes don't change it. Accept it (the description is adjusted and the scores recalculated) or keep requiring it."),
            ...a.persistent_issues.map(p => $("div", { class: "sub" },
              $("span", { class: "badge " + (p.importance === "high" ? "warn" : p.importance === "medium" ? "rec" : "none") },
                `${p.importance} importance`), " ",
              p.deviates_from === "book" ? $("span", { class: "badge warn" }, "📕 differs from the book")
                : p.deviates_from === "decision" ? $("span", { class: "badge warn" }, "✋ differs from your decision")
                : p.deviates_from === "free_choice" ? $("span", { class: "badge none" }, "free choice (the book is silent)") : null,
              ` ${p.issue} (in ${p.seen_in} candidates) `,
              p.source_quote ? $("div", { class: "hint quote" }, (p.deviates_from === "book" ? "Book: " : "Decision: ") + p.source_quote) : null,
              $("button", { class: "primary", disabled: (r.running || r.queued.length > 0) || stale, title: stale ? "Wait for the re-assessment (the description changed)" : "",
                onclick: () => (p.deviates_from === "free_choice" || p.deviates_from === undefined ||
                  confirm(`This contradicts ${p.deviates_from === "book" ? "the book" : "your decision"}:\n\n${p.source_quote}\n\nAccept what FLUX draws anyway?`)) && post("/api/ref/habit",
                { path: r.path, issue: p.issue, accept: true, description: p.description_if_accepted }) }, "Accept"),
              " ", $("button", { onclick: () => post("/api/ref/habit", { path: r.path, issue: p.issue, accept: false }) },
                "Keep requiring it")))) : null,
      a.description_issues && a.description_issues.length
        ? $("div", { class: "issues" }, $("b", {}, "Problems with the description itself:"),
            ...a.description_issues.map(t => $("div", { class: "sub" }, "⚠ " + t))) : null,
      a.suggested_description && a.suggested_description !== r.ref.description
        ? $("div", { class: "suggest" }, $("b", {}, "Suggested description:"),
            $("div", { class: "cap" }, a.suggested_description),
            $("div", { class: "tools" }, $("button", { class: "primary", disabled: busyHere,
              onclick: () => post("/api/ref/generate", { path: r.path, count: 4, description: a.suggested_description }) },
              verb + "Use suggested description & generate 4 new"))) : null) : null;
    const running = r.running ? $("div", { class: "safety" }, "Working… " + (r.status || ""))
      : r.queued.length ? $("div", { class: "safety" },
          `Queued (position ${r.queued[0].position}): ${r.queued.map(q => q.kind).join(", ")}. Starts when the current job is done. `,
          $("button", { onclick: () => post("/api/ref/unqueue", { path: r.path }) }, "Remove from queue"))
      : null;
    const resetNote = !r.ref.approved && (r.ref.approved_history || []).some(h => h.cleared_because)
      ? $("div", { class: "hint" }, "The previous approval was cleared because new candidates were generated. Choose again.") : null;
    const approvedFile = r.ref.approved ? `${r.path}/${r.ref.approved.file}` : null;
    const rank = c => c.assessment ? c.assessment.score * 10 + (a && a.best && c.file.endsWith(a.best) ? 5 : 0) : -1;
    const sorted = [...r.candidates].sort((x, y) => rank(y) - rank(x) || y.file.localeCompare(x.file));
    const cands = sorted.map(c => {
      const isApproved = r.ref.approved && c.file.endsWith(r.ref.approved.from_candidate);
      const as = c.assessment;
      const isBest = a && a.best && c.file.endsWith(a.best);
      const review = as ? $("div", { class: "review" },
        $("div", {}, $("span", { class: "badge " + (as.score >= 4 ? "user" : as.score >= 3 ? "rec" : "none") },
          `score ${as.score}/5`), " ",
          as.matches_book === undefined
            ? (as.matches_description ? $("span", { class: "badge user" }, "matches description")
                                      : $("span", { class: "badge warn" }, "⚠ differs from description"))
            : as.matches_book
              ? $("span", { class: "badge user" }, as.matches_description ? "✓ matches book and description" : "✓ matches the book")
              : $("span", { class: "badge warn" }, "📕 contradicts the book"),
          isBest ? $("span", { class: "badge user" }, " ★ best") : null),
        ...(as.book_conflicts || []).map(t => $("div", { class: "dev book" }, "📕 " + t)),
        ...as.deviations.map(t => $("div", { class: "dev" + (as.book_conflicts ? " free" : "") },
          (as.book_conflicts ? "⚠ free choice differs: " : "⚠ ") + t)),
        ...as.story_conflicts.map(t => $("div", { class: "dev story" }, "📖 " + t)),
        ...as.pros.map(t => $("div", { class: "pro" }, "+ " + t)),
        ...as.cons.map(t => $("div", { class: "con" }, "− " + t))) : null;
      const problems = as ? (as.book_conflicts || []).length + as.deviations.length + as.story_conflicts.length : 0;
      const adoptBtn = as && as.matches_book && as.deviations.length && !busyHere ? $("button", {
        title: "This candidate fits the book: change the free choices in the description to what this image shows (book facts stay)",
        onclick: async e => {
          e.target.disabled = true; e.target.textContent = "Updating description…";
          const res = await (await fetch("/api/ref/adopt", { method: "POST", body: JSON.stringify({ path: r.path, file: c.file }) })).json();
          if (!res.ok) { alert("Could not update:\n" + res.message); renderRefs(main); return; }
          const x = res.result;
          alert("Description updated to match this candidate.\n\nChanged:\n" + (x.changes.map(t => "• " + t).join("\n") || "(nothing)") +
                (x.kept_despite_image.length ? "\n\nKept from the book although the image differs:\n" + x.kept_despite_image.map(t => "• " + t).join("\n") : "") +
                "\n\nThe candidates are being re-assessed.");
          refsSig = ""; renderRefs(main);
        } }, "Use this look for the description") : null;
      const fixBtn = problems && !busyHere ? $("button", {
        title: "Make a NEW candidate from this one: the most important ⚠/📖 point is corrected with an edit (the whole image is redrawn, so other details can drift)",
        onclick: () => {
          if (c.parent && !confirm("This is already a fixed version. Fixing again redraws it once more, and small changes tend to add up (a copy of a copy). Continue?")) return;
          post("/api/ref/fix", { path: r.path, file: c.file });
        } }, (r.busy ? "Queue: " : "") + "Fix this candidate") : null;
      const fr = as && as.fix_result;
      const lineage = c.parent ? $("div", { class: "hint" },
        `Fixed version of seed ${(c.parent.match(/seed(\d+)/) || [])[1]}, aimed at: “${(as && as.fix_target) || c.edit_instruction}”. `,
        fr ? $("span", { class: "badge " + (fr === "improved" ? "user" : fr === "failed" ? "warn" : "none") },
               fr === "improved" ? `fix worked (+${as.score_change})` : fr === "failed" ? `fix failed (${as.score_change})` : "fix made no difference") : null) : null;
      return $("div", { class: "cand" + (isApproved ? " approved" : "") + (isBest ? " best" : "") },

function goToPanels(page) {

function jobLabel(j) {

async function pollJobs() {
  let info = null;
  try { info = await (await fetch("/api/jobs")).json(); } catch (e) {}
  const box = document.getElementById("jobs");
  if (!info || (!info.current && !info.queue.length)) {
    box.hidden = true;
    setTimeout(pollJobs, 8000);
    return;
  }
  box.hidden = false;
  const kids = [$("div", { class: "jtitle" }, "Draw Things / Claude")];
  const c = info.current;
  if (c) {
    let what, pct = null;
    const noun = { generate: "candidate", fix: "fixed candidate", views: "view", panels: "image" }[c.kind];
    if (c.step === "assess") { what = "assessing candidates"; pct = 100; }
    else if (noun && c.step) {
      what = `${noun} ${c.step}/${c.count}`;
      pct = Math.round(100 * (c.done || 0) / c.count);
    } else if (noun) what = c.detail || "preparing…";
    else what = "assessing candidates";
    const mins = Math.floor(c.elapsed / 60), secs = c.elapsed % 60;
    kids.push($("a", { class: "jitem now", href: "#", onclick: e => { e.preventDefault(); c.rel ? goToRef(c.rel) : goToPanels(c.page); } },
      $("div", {}, $("b", {}, "Now: "), c.name), $("div", { class: "jwhat" }, `${what} · ${mins}:${String(secs).padStart(2, "0")}`),
      pct !== null ? $("div", { class: "jbar" }, $("div", { style: `width:${pct}%` })) : null));
  }
  info.queue.forEach((q, i) => kids.push(
    $("a", { class: "jitem", href: "#", onclick: e => { e.preventDefault(); q.rel ? goToRef(q.rel) : goToPanels(q.page); } },
      $("div", {}, $("b", {}, i === 0 ? "Next: " : `${i + 1}. `), q.name), $("div", { class: "jwhat" }, jobLabel(q)))));
  box.replaceChildren(...kids);
  setTimeout(pollJobs, 3000);
}
pollJobs();

let panelsPoll = null, panelsSig = "", showCaptions = localStorage.getItem("showCaptions") !== "0";

const PLACE = {  // CSS position of a caption box for each planned placement
  top_left: "top:3%;left:3%", top: "top:3%;left:50%;transform:translateX(-50%)", top_right: "top:3%;right:3%",
  middle_left: "top:50%;left:3%;transform:translateY(-50%)", middle_right: "top:50%;right:3%;transform:translateY(-50%)",
  bottom_left: "bottom:3%;left:3%", bottom: "bottom:3%;left:50%;transform:translateX(-50%)", bottom_right: "bottom:3%;right:3%" };

let LETTERING = { font_px: 34, line_height: 1.25, padding_px: 14, max_width_px: 640, margin_px: 24 };

function boxStyle(placement, panelWidthPx) {
  // Everything in cqw (% of the image's displayed width), scaled from the real size on the
  // printed page, so a box has the same proportion as the final lettering.
  const u = v => `${(v / panelWidthPx * 100).toFixed(3)}cqw`;
  const m = u(LETTERING.margin_px);
  const pos = (PLACE[placement] || PLACE.top_left).replace(/3%/g, m);
  return `${pos};font-size:${u(LETTERING.font_px)};line-height:${LETTERING.line_height};` +
         `padding:${u(LETTERING.padding_px * 0.6)} ${u(LETTERING.padding_px)};max-width:${u(LETTERING.max_width_px)};` +
         `border-width:max(1px, ${u(3)})`;
}

function textBoxes(p) {
  return [...p.captions.map(c => ({ ...c, kind: "caption" })),
          ...(p.dialogue || []).map(d => ({ ...d, kind: "speech", text: `${d.speaker}: ${d.text}` }))];
}

function withTextBoxes(img, p) {
  // The image with the panel's captions/dialogue at their planned position and real relative
  // size (preview only: real lettering is Milestone E).
  if (!showCaptions || !p.spec) return img;
  const w = p.spec.page_box.w;
  return $("div", { class: "textwrap" }, img,
    ...textBoxes(p).map(b => $("div", { class: "textbox " + b.kind, style: boxStyle(b.placement, w) }, b.text)));
}

  const book = await (await fetch("/api/book")).json();
  if (book.lettering) LETTERING = book.lettering;
  if (!book.pages.length) { main.replaceChildren($("div", { class: "help" }, "No planned pages yet.")); return; }
  bookIndex = Math.max(0, Math.min(bookIndex, book.pages.length - 1));
  const pgState = book.pages[bookIndex];
  const go = d => {
    bookIndex = Math.max(0, Math.min(book.pages.length - 1, bookIndex + d));
    renderBook(main).then(() => {   // start at the top of the new page
      const w = document.getElementById("bookwrap");
      if (document.fullscreenElement === w) w.scrollTop = 0; else w.scrollIntoView({ block: "start" });
    });
  };
  const content = [
    $("button", { class: "booknav prev", disabled: bookIndex === 0, onclick: () => go(-1), title: "Previous page (←)" }, "‹"),
    pageView(book, pgState),
    $("button", { class: "booknav next", disabled: bookIndex === book.pages.length - 1, onclick: () => go(1), title: "Next page (→)" }, "›"),
    $("div", { class: "bookno" }, `Page ${pgState.page} (${bookIndex + 1}/${book.pages.length})`)];
  // In full screen, keep the same element (replacing it would leave full screen).
  const existing = document.getElementById("bookwrap");
  if (existing && document.fullscreenElement === existing) {
    existing.className = "bookwrap fit-" + bookFit;
    existing.replaceChildren(...content);
    return;
  }
  const wrap = $("div", { class: "bookwrap fit-" + bookFit, id: "bookwrap" }, ...content);
  const counts = pgState.panels.reduce((m, p) => (m[p.status] = (m[p.status] || 0) + 1, m), {});
  const exportLink = (href, label) => $("a", { class: "btnlink", href, onclick: e => {
    e.target.textContent = "Rendering PDF…"; setTimeout(() => e.target.textContent = label, 6000); } }, label);
  const bar = $("div", { class: "pagebar" },
    $("button", { disabled: bookIndex === 0, onclick: () => go(-1) }, "← Previous"),
    $("select", { onchange: e => { bookIndex = +e.target.value; renderBook(main); } },
      ...book.pages.map((p, i) => $("option", { value: i, selected: i === bookIndex }, `Page ${p.page}`))),
    $("button", { disabled: bookIndex === book.pages.length - 1, onclick: () => go(1) }, "Next →"),
    $("button", { onclick: () => document.getElementById("bookwrap").requestFullscreen() }, "⛶ Full screen"),
    $("span", { class: "modes" },
      $("button", { class: bookFit === "width" ? "on" : "", onclick: () => { bookFit = "width"; localStorage.setItem("bookFit", "width"); renderBook(main); } }, "Full width"),
      $("button", { class: bookFit === "height" ? "on" : "", onclick: () => { bookFit = "height"; localStorage.setItem("bookFit", "height"); renderBook(main); } }, "Fit to screen")),
    $("label", {}, $("input", { type: "checkbox", checked: bookStatus, onchange: e => {
      bookStatus = e.target.checked; localStorage.setItem("bookStatus", bookStatus ? "1" : "0"); renderBook(main); } }), " show panel status"),
    $("span", { style: "margin-left:auto" }),
    exportLink(`/export.pdf?pages=${pgState.page}`, "⤓ This page as PDF"),
    exportLink(`/export.pdf?all=1`, `⤓ All pages as one PDF (${book.pages.length})`));
  main.replaceChildren(bar,
    $("div", { class: "hint", style: "margin-bottom:8px" },
      "Shows the current state of every planned page: chosen images, else the best assessed, else the newest. ",
      Object.entries(counts).map(([k, v]) => `${v} ${k}`).join(" · "),
      ". Keys: ← → to browse, F for full screen."),
    wrap);
}

document.addEventListener("keydown", e => {
  if (mode !== "book" || ["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName)) return;
  const btn = document.querySelector(e.key === "ArrowLeft" ? ".booknav.prev" : e.key === "ArrowRight" ? ".booknav.next" : null);
  if (btn && !btn.disabled) { btn.click(); e.preventDefault(); }
  if (e.key === "f" || e.key === "F") { const w = document.getElementById("bookwrap"); if (w) w.requestFullscreen(); }
});

load().catch(e => { document.getElementById("status").textContent = "error: " + e; });
</script>
</body>
</html>
